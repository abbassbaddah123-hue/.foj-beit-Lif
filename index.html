<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>إدارة فوج بيت ليف</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f1f5f1;color:#203b2d}

header{background:#174c35;color:white;padding:22px;text-align:center}

main{max-width:700px;margin:20px auto;padding:14px}

.card{background:white;padding:18px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 9px #0001}

input,button{width:100%;padding:13px;margin:7px 0;border-radius:9px;font-size:15px}

input{border:1px solid #ccc}

button{border:0;background:#174c35;color:white;cursor:pointer}

button:disabled{opacity:.6}

.secondary{background:#b38a38}

.danger{background:#b83232}

.team{border:1px solid #e1e8e1;padding:13px;border-radius:10px;margin:10px 0}

.team-actions{display:flex;gap:8px}

.team-actions button{flex:1}

.hidden{display:none}

#message{color:#a33;text-align:center;overflow-wrap:anywhere}

.muted{color:#777;font-size:13px}

</style>

</head>

<body>

<header>

<h1>فوج بيت ليف</h1>

<p>نظام إدارة الأنشطة والحضور</p>

</header>

<main>

<section id="loginBox" class="card">

<h2>تسجيل دخول المدير</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username">

<input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">

<button id="loginBtn">تسجيل الدخول</button>

<p id="message"></p>

</section>

<section id="appBox" class="hidden">

<div class="card">

<h2>لوحة الإدارة</h2>

<p>مرحباً بك في نظام فوج بيت ليف</p>

<button id="logoutBtn" class="danger">تسجيل الخروج</button>

</div>

<div class="card">

<h2>إدارة الفرق الكشفية</h2>

<p class="muted">يمكنك إضافة الفرق وتعديلها وحذفها.</p>

<input id="teamName" placeholder="اكتب اسم الفرقة الجديدة">

<button id="addTeamBtn">+ إضافة فرقة</button>

<p id="teamMessage" class="muted"></p>

</div>

<div class="card">

<h2>الفرق الموجودة</h2>

<div id="teamsList">جاري تحميل الفرق...</div>

</div>

</section>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {

 getAuth,

 signInWithEmailAndPassword,

 onAuthStateChanged,

 signOut

} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {

 getDatabase,

 ref,

 onValue,

 set,

 update,

 remove

} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

const firebaseConfig = {

 apiKey: "AIzaSyC3McwmwHH_JyPX4bdD_KO6Zkh0Z2pDeSA",

 authDomain: "fwjbetlif.firebaseapp.com",

 databaseURL: "https://fwjbetlif-default-rtdb.firebaseio.com",

 projectId: "fwjbetlif",

 storageBucket: "fwjbetlif.firebasestorage.app",

 messagingSenderId: "810985450426",

 appId: "1:810985450426:web:2eef73bfc0e70fcbbf8b83",

 measurementId: "G-YKX4RV19QZ"

};

const ADMIN_UID = "kFXfcTCjqqPbWn9hqG4WS8YF1s72";

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const loginBox = document.getElementById("loginBox");

const appBox = document.getElementById("appBox");

const message = document.getElementById("message");

const teamMessage = document.getElementById("teamMessage");

const teamsList = document.getElementById("teamsList");

const loginBtn = document.getElementById("loginBtn");

let stopTeamsListener = null;

let seeding = false;

const defaultTeams = {

 baraem: {name:"براعم"},

 ashbal: {name:"أشبال"},

 kashafa: {name:"كشافة"},

 jawala: {name:"جوالة"},

 community: {name:"الخدمة المجتمعية"},

 leaders: {name:"القادة"}

};

function showLoginError(error) {

 const code = error.code || "unknown";

 const details = error.message || "لا توجد تفاصيل";

 message.textContent = "رمز الخطأ: " + code + " | " + details;

}

loginBtn.onclick = async () => {

 const email = document.getElementById("email").value.trim();

 const password = document.getElementById("password").value;

 message.textContent = "";

 if (!email || !password) {

   message.textContent = "أدخل البريد الإلكتروني وكلمة المرور.";

   return;

 }

 loginBtn.disabled = true;

 loginBtn.textContent = "جاري تسجيل الدخول...";

 try {

   await signInWithEmailAndPassword(auth,email,password);

 } catch(error) {

   showLoginError(error);

 } finally {

   loginBtn.disabled = false;

   loginBtn.textContent = "تسجيل الدخول";

 }

};

document.getElementById("logoutBtn").onclick = async () => {

 try {

   await signOut(auth);

 } catch(error) {

   message.textContent = "تعذّر تسجيل الخروج: " + error.message;

 }

};

onAuthStateChanged(auth, async user => {

 if(stopTeamsListener) {

   stopTeamsListener();

   stopTeamsListener = null;

 }

 if(!user) {

   loginBox.classList.remove("hidden");

   appBox.classList.add("hidden");

   return;

 }

 if(user.uid !== ADMIN_UID) {

   message.textContent = "هذا الحساب ليس حساب المدير.";

   await signOut(auth);

   return;

 }

 loginBox.classList.add("hidden");

 appBox.classList.remove("hidden");

 loadTeams();

});

function loadTeams() {

 const teamsRef = ref(db,"teams");

 stopTeamsListener = onValue(teamsRef, async snapshot => {

   if(!snapshot.exists() && !seeding) {

     seeding = true;

     try {

       await set(teamsRef,defaultTeams);

       teamMessage.textContent = "تم تجهيز الفرق الأساسية.";

     } catch(error) {

       teamMessage.textContent = "تعذّر إنشاء الفرق: " + error.message;

     }

     return;

   }

   const teams = snapshot.val() || {};

   renderTeams(teams);

 }, error => {

   teamMessage.textContent = "خطأ بتحميل الفرق: " + error.message;

 });

}

function renderTeams(teams) {

 teamsList.replaceChildren();

 const entries = Object.entries(teams);

 if(entries.length === 0) {

   teamsList.textContent = "لا توجد فرق حالياً.";

   return;

 }

 entries.forEach(([id,team]) => {

   const card = document.createElement("div");

   card.className = "team";

   const title = document.createElement("h3");

   title.textContent = team.name || "فرقة بدون اسم";

   const actions = document.createElement("div");

   actions.className = "team-actions";

   const edit = document.createElement("button");

   edit.textContent = "تعديل الاسم";

   edit.className = "secondary";

   edit.onclick = async () => {

     const newName = prompt("اكتب الاسم الجديد:",team.name);

     if(!newName || !newName.trim()) return;

     try {

       await update(ref(db,"teams/"+id),{name:newName.trim()});

       teamMessage.textContent = "تم تعديل اسم الفرقة.";

     } catch(error) {

       teamMessage.textContent = "تعذّر التعديل: " + error.message;

     }

   };

   const del = document.createElement("button");

   del.textContent = "حذف";

   del.className = "danger";

   del.onclick = async () => {

     if(!confirm("هل أنت متأكد من حذف هذه الفرقة؟")) return;

     try {

       await remove(ref(db,"teams/"+id));

       teamMessage.textContent = "تم حذف الفرقة.";

     } catch(error) {

       teamMessage.textContent = "تعذّر الحذف: " + error.message;

     }

   };

   actions.append(edit,del);

   card.append(title,actions);

   teamsList.append(card);

 });

}

document.getElementById("addTeamBtn").onclick = async () => {

 const name = document.getElementById("teamName").value.trim();

 if(!name) {

   teamMessage.textContent = "اكتب اسم الفرقة أولاً.";

   return;

 }

 try {

   const snapshot = await new Promise((resolve,reject) => {

     onValue(ref(db,"teams"),resolve,reject,{onlyOnce:true});

   });

   const teams = snapshot.val() || {};

   const duplicate = Object.values(teams).some(

     team => (team.name || "").trim() === name

   );

   if(duplicate) {

     teamMessage.textContent = "هذه الفرقة موجودة مسبقاً.";

     return;

   }

   const id = "team_" + Date.now();

   await set(ref(db,"teams/"+id),{name:name});

   document.getElementById("teamName").value = "";

   teamMessage.textContent = "تمت إضافة الفرقة بنجاح.";

 } catch(error) {

   teamMessage.textContent = "تعذّرت الإضافة: " + error.message;

 }

};

</script>

</body>

</html>
