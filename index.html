<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>فوج بيت ليف</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial;background:#f1f5f1;color:#203b2d}

header{background:#174c35;color:white;padding:25px;text-align:center}

main{max-width:500px;margin:35px auto;padding:15px}

.card{background:white;padding:22px;border-radius:15px;box-shadow:0 3px 12px #0001}

h2{text-align:center}

input,button{width:100%;padding:14px;margin:9px 0;border-radius:9px;font-size:16px}

input{border:1px solid #ccc}

button{background:#174c35;color:white;border:0;cursor:pointer}

#message{text-align:center;color:#b33}

#dashboard{display:none}

.section{background:#f1f5f1;padding:16px;margin:10px 0;border-radius:10px}

</style>

</head>

<body>

<header>

<h1>فوج بيت ليف</h1>

<p>نظام إدارة الأنشطة والحضور</p>

</header>

<main>

<div class="card" id="login">

<h2>تسجيل الدخول</h2>

<p>أهلاً بكم في نظام فوج بيت ليف</p>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">دخول</button>

<p id="message"></p>

</div>

<div class="card" id="dashboard">

<h2>أهلاً بك في فوج بيت ليف</h2>

<p id="welcome"></p>

<div class="section">الفرق الكشفية</div>

<div class="section">الأنشطة والحضور</div>

<div class="section">الورش الفوجية</div>

<div class="section">القادة والصلاحيات</div>

<div class="section">التقارير والإعدادات</div>

<button id="logoutBtn">تسجيل الخروج</button>

</div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {

 getAuth,

 signInWithEmailAndPassword,

 onAuthStateChanged,

 signOut

} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const firebaseConfig = {

 apiKey: "AIzaSyC3McwmwHH_JyPX4bdD_K6OZkh0Z2pDeSA",

 authDomain: "fwjbetlif.firebaseapp.com",

 databaseURL: "https://fwjbetlif-default-rtdb.firebaseio.com",

 projectId: "fwjbetlif",

 storageBucket: "fwjbetlif.firebasestorage.app",

 messagingSenderId: "810985450426",

 appId: "1:810985450426:web:2eef73bfc0e70fcbbf8b83",

 measurementId: "G-YKX4RV19QZ"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const loginBox = document.getElementById("login");

const dashboard = document.getElementById("dashboard");

const message = document.getElementById("message");

document.getElementById("loginBtn").onclick = async () => {

 const email = document.getElementById("email").value.trim();

 const password = document.getElementById("password").value;

 message.textContent = "";

 try {

   await signInWithEmailAndPassword(auth,email,password);

 } catch(error) {

   message.textContent = "تعذّر تسجيل الدخول. تأكد من البريد وكلمة المرور.";

 }

};

onAuthStateChanged(auth, user => {

 if(user) {

   loginBox.style.display = "none";

   dashboard.style.display = "block";

   document.getElementById("welcome").textContent =

     "تم تسجيل الدخول: " + user.email;

 } else {

   loginBox.style.display = "block";

   dashboard.style.display = "none";

 }

});

document.getElementById("logoutBtn").onclick = () => signOut(auth);

</script>

</body>

</html>
